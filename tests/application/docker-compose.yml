---
name: bbpress-permalinks-with-id-application-tests
services:
  syslog:
    build:
      context: ./containers/syslog
      dockerfile: ./syslog.Dockerfile
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    volumes:
      - syslog_data:/var/log/remote
    ports:
      - '127.0.0.1:1514:1514/udp'
    healthcheck:
      test: ["CMD-SHELL", "netstat -uln | grep -q 1514"]
      start_period: 3s
      start_interval: 1s
      timeout: 2s
      retries: 3

  wordpress:
    build:
      context: ./containers/wordpress
      dockerfile: ./wordpress.Dockerfile
      args:
        WORDPRESS_ARG_BASE_IMAGE: "${WORDPRESS_ARG_BASE_IMAGE}"
        WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL: "${WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL}"
        WORDPRESS_ARG_THEME_ZIP_URL: "${WORDPRESS_ARG_THEME_ZIP_URL}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    networks:
      default:
        aliases:
          - "${WORDPRESS_DOMAIN}"
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      WORDPRESS_DEBUG: true
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'WP_POST_REVISIONS', false );
    tmpfs:
      - /var/run/apache2
      - /tmp
      - /var
    volumes:
      - wordpress_data:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/bbpress-permalinks-with-id
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:1514"
        tag: "wordpress"
    depends_on:
      db:
        condition: service_healthy
      syslog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://${WORDPRESS_DOMAIN}:8080/index.php/wp-json/"]
      start_period: 2s
      start_interval: 5s
      timeout: 5s
      retries: 3

  db:
    image: mysql:8.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: 10001:10001
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "--host=127.0.0.1", "--user=$$MYSQL_USER", "--password=$$MYSQL_PASSWORD" ]
      start_period: 5s
      start_interval: 10s
      timeout: 5s
      retries: 3
    tmpfs:
      - /tmp
      - /var/run/mysqld
    volumes:
      - db_data:/var/lib/mysql

  cli:
    image: "${CLI_ARG_BASE_IMAGE}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      WORDPRESS_SITE_HOME: "http://${WORDPRESS_DOMAIN}:8080"
      WORDPRESS_SITE_TITLE: "${WORDPRESS_SITE_TITLE}"
      WORDPRESS_ADMIN_LOGIN: "${WORDPRESS_ADMIN_LOGIN}"
      WORDPRESS_ADMIN_PASSWORD: "${WORDPRESS_ADMIN_PASSWORD}"
      WORDPRESS_ADMIN_EMAIL: "${WORDPRESS_ADMIN_EMAIL}"
      WORDPRESS_SITE_LOCALE: "${WORDPRESS_SITE_LOCALE}"
    volumes_from:
      - wordpress
    volumes:
      - ./containers/cli/shells/:/tmp/shells/:ro
    depends_on:
      wordpress:
        condition: service_healthy
      db:
        condition: service_healthy
    command: [ "bash", "/tmp/shells/install-wordpress.sh" ]

  php:
    build:
      dockerfile: ./containers/php/php.Dockerfile
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tty: true
    init: true
    volumes:
      - ./:/root/tests-application
      - ./containers/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - syslog_data:/var/log/remote:ro
    ports:
      - '127.0.0.1:9009:9009'
    environment:
      WORDPRESS_SITE_HOME: "http://${WORDPRESS_DOMAIN}:8080"
      WORDPRESS_ADMIN_LOGIN: "${WORDPRESS_ADMIN_LOGIN}"
      WORDPRESS_ADMIN_PASSWORD: "${WORDPRESS_ADMIN_PASSWORD}"
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  syslog_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
  wordpress_data:
  db_data:
