---
services:
  wordpress:
    container_name: wordpress
    build:
      context: .
      dockerfile: wordpress.Dockerfile
    networks:
      default:
        aliases:
          - one.wordpress.test
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: true
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - wordpress_data:/var/www/html
      - ../../../:/var/www/html/wp-content/plugins/bbpress-permalinks-with-id
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      start_period: 5s
      start_interval: 10s
      timeout: 5s
      retries: 3

  db:
    container_name: db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "--host=127.0.0.1", "--user=$$MYSQL_USER", "--password=$$MYSQL_PASSWORD" ]
      start_period: 5s
      start_interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql

  cli:
    container_name: cli
    image: wordpress:cli
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      TEST_SITE_HOME: http://one.wordpress.test:8080
      TEST_SITE_TITLE: Test Site
      TEST_SITE_ADMIN_LOGIN: admin
      TEST_SITE_ADMIN_PASSWORD: 12345
      TEST_SITE_ADMIN_EMAIL: admin@one.wordpress.test
      TEST_SITE_LOCALE: en_US
    volumes_from:
      - wordpress
    volumes:
      - ./shells/:/tmp/shells/:ro
    depends_on:
      wordpress:
        condition: service_healthy
      db:
        condition: service_healthy
    command: [ "bash", "/tmp/shells/install-wordpress.sh" ]

  php:
    container_name: php
    build:
      dockerfile: php.Dockerfile
    tty: true
    init: true
    volumes:
      - ./:/root/tests-application
      - ./php-configs/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    ports:
      - '127.0.0.1:9003:9003/tcp'
    environment:
      TEST_SITE_HOME: http://one.wordpress.test:8080
      TEST_SITE_ADMIN_LOGIN: admin
      TEST_SITE_ADMIN_PASSWORD: 12345
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  wordpress_data:
  db_data:
