---
services:
  wordpress:
    container_name: wordpress
    build:
      context: ./containers/wordpress
      dockerfile: ./wordpress.Dockerfile
      args:
        WORDPRESS_ARG_BASE_IMAGE: "${WORDPRESS_ARG_BASE_IMAGE}"
        WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL: "${WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL}"
        WORDPRESS_ARG_THEME_ZIP_URL: "${WORDPRESS_ARG_THEME_ZIP_URL}"
    networks:
      default:
        aliases:
          - "${TEST_SITE_DOMAIN}"
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      WORDPRESS_DEBUG: true
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'WP_POST_REVISIONS', false );
    volumes:
      - wordpress_data:/var/www/html
      - ../../../:/var/www/html/wp-content/plugins/bbpress-permalinks-with-id
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      start_period: 5s
      start_interval: 10s
      timeout: 5s
      retries: 3

  db:
    container_name: db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "--host=127.0.0.1", "--user=$$MYSQL_USER", "--password=$$MYSQL_PASSWORD" ]
      start_period: 5s
      start_interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql

  cli:
    container_name: cli
    image: wordpress:cli
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      TEST_SITE_HOME: "http://${TEST_SITE_DOMAIN}:8080"
      TEST_SITE_TITLE: "${TEST_SITE_TITLE}"
      TEST_SITE_ADMIN_LOGIN: "${TEST_SITE_ADMIN_LOGIN}"
      TEST_SITE_ADMIN_PASSWORD: "${TEST_SITE_ADMIN_PASSWORD}"
      TEST_SITE_ADMIN_EMAIL: "${TEST_SITE_ADMIN_EMAIL}"
      TEST_SITE_LOCALE: "${TEST_SITE_LOCALE}"
    volumes_from:
      - wordpress
    volumes:
      - ./shells/:/tmp/shells/:ro
    depends_on:
      wordpress:
        condition: service_healthy
      db:
        condition: service_healthy
    command: [ "bash", "/tmp/shells/install-wordpress.sh" ]

  php:
    container_name: php
    build:
      dockerfile: ./containers/php/php.Dockerfile
    tty: true
    init: true
    volumes:
      - ./:/root/tests-application
      - ./php-configs/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    ports:
      - '127.0.0.1:9009:9009'
    environment:
      TEST_SITE_HOME: "http://${TEST_SITE_DOMAIN}:8080"
      TEST_SITE_ADMIN_LOGIN: "${TEST_SITE_ADMIN_LOGIN}"
      TEST_SITE_ADMIN_PASSWORD: "${TEST_SITE_ADMIN_PASSWORD}"
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  wordpress_data:
  db_data:
