name: Code Testing

on:
  pull_request:
  push:
    branches:
      - 'develop'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: '${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  php-syntax-check:
    name: 'PHP ${{ matrix.php-versions }} Syntax Check'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions:
          - '5.6'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: none
          tools: none
          ini-file: development
          php-version: ${{ matrix.php-versions }}

      - name: Run PHP Syntax Check
        run: make php-syntax-check

  php-syntax-check-tests-application:
    name: 'PHP Syntax Check. Tests. Application'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: none
          tools: none
          ini-file: development
          php-version: 8.4

      - name: Run PHP Syntax Check
        run: make php-syntax-check-tests-application

  phpcs:
    name: 'PHP Coding Standards and Compatibility'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-file: development
          extensions: filter, libxml, tokenizer, xmlreader, iconv, mbstring
          tools: composer

      - name: Detect Composer Cache Directory
        id: composer-cache
        run: 'echo "cache-files-dir=$(composer config cache-files-dir --global)" >> $GITHUB_OUTPUT'

      - name: Composer Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.cache-files-dir }}
            development/phpcs/vendor
          key: ${{ runner.os }}-composer-phpcs-${{ hashFiles('development/phpcs/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-phpcs-

      - name: Composer Install
        working-directory: development/phpcs
        run: make vendor

      - name: Run PHP Coding Standards and Compatibility
        run: make phpcs

  php-stan:
    name: 'PHP Stan. WordPress ${{ matrix.config.wordpress }}. bbPress ${{ matrix.config.bbpress }}'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          # Lowest supported versions of WordPress and bbPress
          - wordpress: 4.1-branch
            bbpress: 2.5

          # Latest WordPress 5.*
          - wordpress: 5.9-branch
            bbpress: 2.5

          # WordPress 6.0.*
          - wordpress: 6.0-branch
            bbpress: 2.6

          # Latest versions of WordPress and bbPress
          - wordpress: 6.8-branch
            bbpress: 2.6
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-file: development
          extensions: ''
          tools: composer

      - name: Detect Composer Cache Directory
        id: composer-cache
        run: 'echo "cache-files-dir=$(composer config cache-files-dir --global)" >> $GITHUB_OUTPUT'

      - name: Composer Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.cache-files-dir }}
            development/php-stan/vendor
          key: ${{ runner.os }}-composer-php-stan-${{ hashFiles('development/php-stan/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php-stan-

      - name: Composer Install
        working-directory: development/php-stan
        run: make vendor

      - name: Cache PHP Stan Stubs
        id: 'cache-php-stan-stubs'
        uses: actions/cache@v6
        with:
          path: |
            development/php-stan/.cache
          key: php-stan-stubs-${{ matrix.config.wordpress }}--${{ matrix.config.bbpress }}
          restore-keys: |
            php-stan-stubs-

      - name: Checkout WordPress
        uses: actions/checkout@v7
        if: steps.cache-php-stan-stubs.outputs.cache-hit != 'true'
        with:
          repository: WordPress/WordPress
          ref: ${{ matrix.config.wordpress }}
          path: development/php-stan/.cache/wordpress
          show-progress: false
          persist-credentials: false

      - name: Checkout bbPress
        uses: actions/checkout@v7
        if: steps.cache-php-stan-stubs.outputs.cache-hit != 'true'
        with:
          repository: bbpress/bbPress
          ref: ${{ matrix.config.bbpress }}
          path: development/php-stan/.cache/bbpress
          show-progress: false
          persist-credentials: false

      - name: Generate PHP Stan Stubs. WordPress ${{ matrix.config.wordpress }}
        if: steps.cache-php-stan-stubs.outputs.cache-hit != 'true'
        working-directory: development/php-stan
        run: make .cache/stubs/wordpress.stub --always-make

      - name: Generate PHP Stan Stubs. bbPress ${{ matrix.config.bbpress }}
        if: steps.cache-php-stan-stubs.outputs.cache-hit != 'true'
        working-directory: development/php-stan
        run: make .cache/stubs/bbpress.stub --always-make

      - name: Run PHP Stan
        run: make phpstan
        continue-on-error: true # TODO: remove this parameter after fixing the code

  psalm-pre:
    name: Prepare Psalm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          # Lowest supported versions of WordPress and bbPress
          - wordpress: 4.1-branch
            bbpress: 2.5

          # Latest WordPress 5.*
          - wordpress: 5.9-branch
            bbpress: 2.5

          # WordPress 6.0.*
          - wordpress: 6.0-branch
            bbpress: 2.6

          # Latest versions of WordPress and bbPress
          - wordpress: 6.8-branch
            bbpress: 2.6
    permissions:
      contents: read
    steps:
      - name: Hooks cache
        id: hooks-cache
        uses: actions/cache@v6
        with:
          path: |
            development/hooks-generator/.cache/wordpress-hooks
            development/hooks-generator/.cache/bbpress-hooks
          key: hooks-generator-hooks-wordpress-${{ matrix.config.wordpress }}-bbpress-${{ matrix.config.bbpress }}
          restore-keys: hooks-generator-hooks-

      - name: Checkout code
        uses: actions/checkout@v7
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        with:
          persist-credentials: false

      - name: Run Hooks Generator
        uses: ./.github/actions/hooks-generator
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        with:
          wordpress: ${{ matrix.config.wordpress }}
          bbpress: ${{ matrix.config.bbpress }}

  psalm:
    needs: psalm-pre
    name: Psalm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          # Lowest supported versions of WordPress and bbPress
          - wordpress: 4.1-branch
            bbpress: 2.5

          # Latest WordPress 5.*
          - wordpress: 5.9-branch
            bbpress: 2.5

          # WordPress 6.0.*
          - wordpress: 6.0-branch
            bbpress: 2.6

          # Latest versions of WordPress and bbPress
          - wordpress: 6.8-branch
            bbpress: 2.6
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          ini-file: development
          extensions: ''
          tools: composer

      - name: Detect Composer Cache Directory
        id: composer-cache
        shell: bash
        run: 'echo "cache-files-dir=$(composer config cache-files-dir --global)" >> $GITHUB_OUTPUT'

      - name: Composer Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.cache-files-dir }}
            development/psalm/vendor
          key: ${{ runner.os }}-psalm-composer-${{ hashFiles('development/psalm/composer.lock') }}
          restore-keys: ${{ runner.os }}-psalm-composer-

      - name: Composer Install
        working-directory: development/psalm
        run: make vendor

      - name: Hooks Cache
        id: hooks-cache
        uses: actions/cache@v6
        with:
          path: |
            development/hooks-generator/.cache/wordpress-hooks
            development/hooks-generator/.cache/bbpress-hooks
          key: hooks-generator-hooks-wordpress-${{ matrix.config.wordpress }}-bbpress-${{ matrix.config.bbpress }}
          restore-keys: hooks-generator-hooks-
          fail-on-cache-miss: true

      - name: Dependencies cache
        id: dependencies-cache
        uses: actions/cache@v6
        with:
          path: |
            development/hooks-generator/.cache/wordpress
            development/hooks-generator/.cache/bbpress
          key: hooks-generator-dependencies-wordpress-${{ matrix.config.wordpress }}-bbpress-${{ matrix.config.bbpress }}
          restore-keys: hooks-generator-dependencies-
          fail-on-cache-miss: true

      - name: Psalm Cache
        uses: actions/cache@v6
        with:
          path: development/psalm/.cache/psalm
          key: psalm-cache-wordpress-${{ matrix.config.wordpress }}-bbpress-${{ matrix.config.bbpress }}
          restore-keys: psalm-cache-

      - name: Psalm
        run: make psalm
        continue-on-error: true

  psalm-tests-application:
    name: Psalm. Tests Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          ini-file: development
          extensions: ''
          tools: composer

      - name: Detect Composer Cache Directory
        id: composer-cache
        shell: bash
        run: 'echo "cache-files-dir=$(composer config cache-files-dir --global)" >> $GITHUB_OUTPUT'

      - name: Composer Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.cache-files-dir }}
            development/psalm/vendor
          key: ${{ runner.os }}-psalm-composer-${{ hashFiles('development/psalm/composer.lock') }}
          restore-keys: ${{ runner.os }}-psalm-composer-

      - name: Composer Cache. Tests Application
        uses: actions/cache@v6
        with:
          path: tests/application/vendor
          key: ${{ runner.os }}-tests-application-composer-${{ hashFiles('tests/application/composer.lock') }}
          restore-keys: ${{ runner.os }}-tests-application-composer-

      - name: Composer Install
        working-directory: development/psalm
        run: make vendor

      - name: Composer Install. Tests Application
        working-directory: tests/application
        run: make vendor

      - name: Psalm Cache
        uses: actions/cache@v6
        with:
          path: development/psalm/.cache/psalm-tests-application
          key: psalm-tests-application-${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          restore-keys: psalm-tests-application-

      - name: Psalm
        run: make psalm-tests-application

  phpmd:
    name: 'PHP Mess Detector'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-file: development
          extensions: ''
          tools: composer

      - name: Detect Composer Cache Directory
        id: composer-cache
        run: 'echo "cache-files-dir=$(composer config cache-files-dir --global)" >> $GITHUB_OUTPUT'

      - name: Composer Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.cache-files-dir }}
            development/phpmd/vendor
          key: ${{ runner.os }}-composer-phpmd-${{ hashFiles('development/phpmd/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-phpmd-

      - name: Composer Install
        working-directory: development/phpmd
        run: make vendor

      - name: PHP Mess Detector Cache
        uses: actions/cache@v6
        with:
          path: development/phpmd/.cache
          key: phpmd-cache-${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          restore-keys: phpmd-cache-

      - name: Run PHP Mess Detector
        run: make phpmd PHPMD_OUTPUT_TYPE=github
        continue-on-error: true # TODO: remove this parameter after fixing the code

  tests-application:
    name: Application Tests
    uses: ./.github/workflows/tests-application.yml
    permissions:
      contents: read
    strategy:
      matrix:
        config:
          - wordpress_arg_base_image: 'wordpress:latest'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.8'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.7'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.6'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.5'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.4'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.3'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.2'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.1'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:6.0'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.6.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
          - wordpress_arg_base_image: 'wordpress:5.9'
            cli_arg_base_image: 'wordpress:cli'
            wordpress_arg_plugin_bbpress_zip_url: 'https://downloads.wordpress.org/plugin/bbpress.2.5.14.zip'
            wordpress_arg_theme_zip_url: 'https://downloads.wordpress.org/theme/twentytwelve.4.7.zip'
    secrets:
      MYSQL_DATABASE: ${{ secrets.APPLICATION_TESTS_MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.APPLICATION_TESTS_MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.APPLICATION_TESTS_MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.APPLICATION_TESTS_MYSQL_ROOT_PASSWORD }}
      WORDPRESS_ADMIN_LOGIN: ${{ secrets.APPLICATION_TESTS_WORDPRESS_ADMIN_LOGIN }}
      WORDPRESS_ADMIN_PASSWORD: ${{ secrets.APPLICATION_TESTS_WORDPRESS_ADMIN_PASSWORD }}
      WORDPRESS_ADMIN_EMAIL: ${{ secrets.APPLICATION_TESTS_WORDPRESS_ADMIN_EMAIL }}
    with:
      WORDPRESS_ARG_BASE_IMAGE: ${{ matrix.config.wordpress_arg_base_image }}
      WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL: ${{ matrix.config.wordpress_arg_plugin_bbpress_zip_url }}
      WORDPRESS_ARG_THEME_ZIP_URL: ${{ matrix.config.wordpress_arg_theme_zip_url }}
      CLI_ARG_BASE_IMAGE: ${{ matrix.config.cli_arg_base_image }}
      WORDPRESS_DOMAIN: 'one.wordpress.test'
      WORDPRESS_SITE_TITLE: 'Test Site'
      WORDPRESS_SITE_LOCALE: 'en_US'
