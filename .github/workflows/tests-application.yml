name: Application Tests

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MYSQL_DATABASE:
        required: true
      MYSQL_USER:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_ROOT_PASSWORD:
        required: true

      WORDPRESS_ADMIN_LOGIN:
        required: true
      WORDPRESS_ADMIN_PASSWORD:
        required: true
      WORDPRESS_ADMIN_EMAIL:
        required: true

    inputs:
      WORDPRESS_ARG_BASE_IMAGE:
        type: string
        default: 'wordpress:latest'
        required: true
      WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL:
        type: string
        default: 'https://downloads.wordpress.org/plugin/bbpress.2.6.0.zip'
        required: true
      WORDPRESS_ARG_THEME_ZIP_URL:
        type: string
        default: 'https://downloads.wordpress.org/theme/twentytwelve.4.6.zip'
        required: true
      WORDPRESS_DOMAIN:
        type: string
        default: 'one.wordpress.test'
        required: true
      WORDPRESS_SITE_TITLE:
        type: string
        default: 'Test Site'
        required: true
      WORDPRESS_SITE_LOCALE:
        type: string
        default: 'en_US'
        required: true

jobs:
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      WORDPRESS_ADMIN_LOGIN: ${{ secrets.WORDPRESS_ADMIN_LOGIN }}
      WORDPRESS_ADMIN_PASSWORD: ${{ secrets.WORDPRESS_ADMIN_PASSWORD }}
      WORDPRESS_ADMIN_EMAIL: ${{ secrets.WORDPRESS_ADMIN_EMAIL }}
      WORDPRESS_ARG_BASE_IMAGE: ${{ inputs.WORDPRESS_ARG_BASE_IMAGE }}
      WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL: ${{ inputs.WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL }}
      WORDPRESS_ARG_THEME_ZIP_URL: ${{ inputs.WORDPRESS_ARG_THEME_ZIP_URL }}
      WORDPRESS_DOMAIN: ${{ inputs.WORDPRESS_DOMAIN }}
      WORDPRESS_SITE_TITLE: ${{ inputs.WORDPRESS_SITE_TITLE }}
      WORDPRESS_SITE_LOCALE: ${{ inputs.WORDPRESS_SITE_LOCALE }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        cleanup: true

    - name: Docker Compose Build
      working-directory: .github/tests/application
      run: make build

    - name: Docker Compose Up
      working-directory: .github/tests/application
      run: make up

    - name: Composer Install
      working-directory: .github/tests/application
      run: make composer_install_from_host

    - name: Run Application Tests
      working-directory: .github/tests/application
      run: make run_tests_from_host

    - name: Docker Compose Down
      working-directory: .github/tests/application
      if: always()
      run: make down
