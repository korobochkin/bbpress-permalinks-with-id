name: CI Debug

on: workflow_dispatch

concurrency:
  group: 'ci-debug'
  cancel-in-progress: true

permissions: {}

jobs:
  tests-application:
    name: Run Application Tests
    uses: ./.github/workflows/tests-application.yml
    permissions:
      contents: read
    secrets:
      MYSQL_DATABASE: ${{ secrets.APPLICATION_TESTS_MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.APPLICATION_TESTS_MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.APPLICATION_TESTS_MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.APPLICATION_TESTS_MYSQL_ROOT_PASSWORD }}
      TEST_SITE_ADMIN_LOGIN: ${{ secrets.APPLICATION_TESTS_TEST_SITE_ADMIN_LOGIN }}
      TEST_SITE_ADMIN_PASSWORD: ${{ secrets.APPLICATION_TESTS_TEST_SITE_ADMIN_PASSWORD }}
      TEST_SITE_ADMIN_EMAIL: ${{ secrets.APPLICATION_TESTS_TEST_SITE_ADMIN_EMAIL }}
    with:
      WORDPRESS_ARG_BASE_IMAGE: 'wordpress:latest'
      WORDPRESS_ARG_PLUGIN_BBPRESS_ZIP_URL: 'https://downloads.wordpress.org/plugin/bbpress.2.6.0.zip'
      WORDPRESS_ARG_THEME_ZIP_URL: 'https://downloads.wordpress.org/theme/twentytwelve.4.6.zip'
      TEST_SITE_DOMAIN: 'one.wordpress.test'
      TEST_SITE_TITLE: 'Test Site'
      TEST_SITE_LOCALE: 'en_US'

